services:
  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BASE_URL: http://localhost:8001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly: Redis escribe cada operación a disco, así los enlaces
    # sobreviven si el contenedor se reinicia.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-datos:
