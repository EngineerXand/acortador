server {
    listen 80;

    # DNS interno de Docker: "api" resuelve a las IPs de TODAS las réplicas.
    # Con variable + resolver, Nginx vuelve a consultar el DNS cada 5 s,
    # así que detecta réplicas que se reinician o se agregan.
    resolver 127.0.0.11 valid=5s;

    location / {
        set $backend http://api:8000;
        proxy_pass $backend;   # reparto round-robin entre las IPs resueltas

        # Si una réplica no responde, reintenta con otra.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # Muestra qué réplica atendió (útil para demostrar el balanceo).
        add_header X-Upstream $upstream_addr always;
    }
}
